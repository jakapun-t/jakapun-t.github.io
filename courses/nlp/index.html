/* Design tokens for course pages. Source of truth: change values here, not in components.
   Theme "Paper": white reading cards on a warm grey ground, rust accent.
   All text/background pairs below were checked at WCAG AA (4.5:1) or better. */

:root {
  /* ground and surfaces */
  --ground: #efebe3;          /* page background behind cards */
  --card: #ffffff;            /* every surface students read on */
  --card-border: #e2ddd2;
  --card-shadow: 0 6px 20px rgba(42, 39, 34, .05);
  --rule: #ece7dd;            /* thin lines inside cards */
  --cream: #f5f2e9;           /* menus, inline code, chips */
  --banner-gradient: linear-gradient(120deg, #f7e6dc 0%, #f5efe4 45%, #ebeef0 100%);
  --summary-gradient: linear-gradient(90deg, #f8ece5, #f5f2e9);

  /* text */
  --ink: #2a2722;             /* 14.9:1 on white */
  --ink-2: #4a453e;           /* secondary body text */
  --muted: #6b655c;           /* 5.8:1 on white; never use anything lighter for text */
  --accent: #a44f2b;          /* rust, 5.6:1 on white; links, active items */
  --accent-tint: #f8ece5;

  /* content-kind tags: background / text, plus a solid swatch for the legend */
  --tag-concept-bg: #e6eef7;  --tag-concept-fg: #1f3d5c;  --tag-concept-dot: #4d7aa8;
  --tag-example-bg: #faf0d9;  --tag-example-fg: #6b4a12;  --tag-example-dot: #c08a2e;
  --tag-code-bg: #2a2722;     --tag-code-fg: #f5f2e9;     --tag-code-dot: #2a2722;
  --tag-exercise-bg: #e3efe6; --tag-exercise-fg: #2e5537; --tag-exercise-dot: #4f8a5f;
  --tag-warning-bg: #f8e5dc;  --tag-warning-fg: #7d3a1f;  --tag-warning-dot: #a44f2b;

  /* status notes (always paired with an icon, never color alone) */
  --ok: #2e5537;
  --bad: #a44f2b;

  /* code */
  --code-bg: #2a2722;
  --code-fg: #f0ebe0;
  --code-keyword: #e3a07f;
  --code-string: #c9d6a3;
  --code-comment: #a8a196;
  --code-line-highlight: #4a3b31;

  /* type */
  --font-thai: 'Sarabun', system-ui, sans-serif;
  --font-latin: 'Anuphan', 'Sarabun', sans-serif;   /* real build: unicode-range split, see CLAUDE.md §4 */
  --font-mono: 'IBM Plex Mono', 'Sarabun', ui-monospace, monospace;
  --font-math: KaTeX_Main, 'Times New Roman', serif; /* KaTeX default fonts, rendered at build */

  --text-body: 20px;      --leading-body: 1.85;
  --text-small: 16px;     /* Thai never below this */
  --text-label: 14px;     /* tags and IDs only */
  --text-h1: 58px;        --leading-h1: 1.08;
  --text-h2: 34px;        --leading-h2: 1.2;
  --text-subtitle-th: 20px;
  --weight-heading: 600;

  /* focus mode (projector) */
  --focus-h: 60px;
  --focus-example: 90px;
  --focus-chip: 80px;
  --focus-body: 26px;

  /* shape and space */
  --radius-card: 24px;
  --radius-block: 18px;
  --radius-chip: 10px;
  --radius-pill: 999px;
  --pad-card: 32px 36px 40px;
  --gap-cards: 28px;
  --page-max: none;       /* lesson pages fill any screen: the menu and the cards stretch, no empty sides */
  --reading-max: 924px;   /* the course home page's single column */
  --tap: 44px;            /* minimum touch target */

  /* added by the build: values taken from the reference designs, so page.css has no raw colours */
  --tag-example-border: #efe1c2;
  --tag-exercise-border: #cfe2d4;
  --tag-exercise-rule: #d6e6da;
  --tag-exercise-strip-end: #eef4ef;
  --tag-exercise-id: #4a5a4d;
  --code-number: #f0c27b;
  --code-rule: #3a3630;
  --code-button-border: #5a544b;
  --on-dark-muted: #d6d0c4;   /* secondary text on --ink backgrounds */
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--ground); color: var(--ink);
  font: var(--text-body)/1.7 'Course Text', var(--font-thai);
}
[lang='en'] { font-family: 'Course Head', var(--font-latin); }
.hidden { display: none !important; }
.card {
  width: 100%; max-width: 460px; padding: 36px 36px 32px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius-card); box-shadow: var(--card-shadow);
}
.course { margin: 0; font: var(--weight-heading) 26px/1.25 'Course Head', var(--font-latin); letter-spacing: -.01em; }
.course-th { margin: 4px 0 0; font-size: var(--text-small); color: var(--muted); }
.rule { height: 1px; margin: 22px 0; background: var(--rule); border: 0; }
.instructions { margin: 0 0 16px; color: var(--ink-2); font-size: 18px; }
label.field { display: block; margin-bottom: 6px; font-weight: 500; font-size: var(--text-small); }
.pw { display: flex; gap: 8px; }
.pw input {
  flex: 1; min-width: 0; min-height: var(--tap); padding: 0 14px;
  border: 1px solid var(--muted); border-radius: 12px; background: var(--card); color: var(--ink);
  font: 18px 'Course Text', var(--font-thai);
}
.toggle {
  min-height: var(--tap); min-width: 64px; padding: 0 12px;
  border: 1px solid var(--card-border); border-radius: 12px; background: var(--cream); color: var(--ink);
  font: 500 var(--text-small) 'Course Text', var(--font-thai); cursor: pointer;
}
.remember { display: flex; align-items: center; gap: 10px; min-height: var(--tap); margin-top: 10px; font-size: var(--text-small); color: var(--ink-2); cursor: pointer; }
.remember input { width: 20px; height: 20px; accent-color: var(--ink); }
.error { margin: 10px 0 0; color: var(--bad); font-size: var(--text-small); font-weight: 500; }
.submit {
  width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: var(--radius-pill);
  background: var(--ink); color: var(--card); font: 600 18px 'Course Text', var(--font-thai); cursor: pointer;
}
.submit:hover { background: var(--ink-2); }
.help { margin: 18px 0 0; font-size: var(--text-small); color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); color: var(--accent); font-size: var(--text-small); text-decoration: underline; text-underline-offset: 3px; }
.back [lang='en'] { color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--card-border); border-right-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
@media (max-width: 480px) { .card { padding: 28px 22px 24px; } }
</style>

    error.textContent = "";
    const password = document.getElementById("staticrypt-password").value;
    const remember = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
    if (!isSuccessful) {
      error.textContent = templateError;
      document.getElementById("staticrypt-password").select();
    }
  });
</script>
</body>
</html>
